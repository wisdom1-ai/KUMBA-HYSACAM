<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#087747">
  <title>Forgot password | HYSACAM Kumba Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body auth-reference-body">
  <main class="auth-reference-page"><section class="auth-reference-card auth-reference-reset" aria-labelledby="reset-heading">
    <a class="auth-reference-logo" href="index.html" aria-label="HYSACAM Kumba Tracker home"><img src="images/hysacam-symbol.png" alt="HYSACAM logo"></a>
    <h1 id="reset-heading">Forgot password?</h1><p class="auth-reference-reset-copy" id="reset-subtitle">Enter your account email to receive a 6-digit reset code</p>
    <form class="auth-reference-form" id="reset-request-form">
      <div class="auth-reference-field"><label for="reset-email">Email</label><input id="reset-email" type="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" required placeholder="Enter your email address"></div>
      <button class="auth-reference-submit" id="reset-request-submit" type="submit">Send reset code</button>
    </form>
    <form class="auth-reference-form" id="reset-complete-form" hidden>
      <p class="auth-reference-reset-copy">Enter the 6-digit code sent to your email</p>
      <div id="reset-code-stage">
        <div class="auth-reference-field"><label for="reset-code">6-digit verification code</label><input id="reset-code" type="text" inputmode="numeric" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" maxlength="6" pattern="[0-9]{6}" required placeholder="Enter 6-digit code"></div>
        <p class="auth-reference-reset-copy">Your code will be checked automatically when all 6 digits are entered</p>
      </div>
      <section id="reset-password-fields" hidden>
        <div class="auth-reference-field"><label for="new-password">New password</label><div class="auth-reference-password"><input id="new-password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"><button type="button" data-toggle-password="new-password">Show</button></div></div>
        <div class="auth-reference-field"><label for="confirm-new-password">Confirm new password</label><div class="auth-reference-password"><input id="confirm-new-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Re-enter new password"><button type="button" data-toggle-password="confirm-new-password">Show</button></div></div>
        <button class="auth-reference-submit" id="reset-complete-submit" type="submit">Reset password</button>
      </section>
      <p class="auth-reference-reset-copy">Didn't receive a code? <a href="#" id="request-another-code">Send another code</a></p>
    </form>
    <div class="auth-message" id="auth-message" role="alert" aria-live="polite"></div>
    <p class="auth-reference-switch"><a href="signin.html">Return to sign in</a></p>
  </section></main>
  <script src="js/auth-common.js"></script><script src="js/forgot-password.js"></script><script src="js/auth-ui.js"></script>
</body></html>
