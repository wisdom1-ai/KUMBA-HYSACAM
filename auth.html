<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYSACAM Tracker - Create Account</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 380px;
      box-sizing: border-box;
      box-shadow: 0 4px 15px #0002;
    }
    h2 { text-align: center; color: #147d4b; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #147d4b;
      color: white;
      border: none;
      font-weight: bold;
    }
    #message { font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>HYSACAM Tracker</h2>
    <p>Create your account to continue.</p>

    <form id="signupForm">
      <input id="email" type="email"
        placeholder="Your Gmail address" required>
    
<div style="position:relative;">
  <input id="password" type="password"
    placeholder="Create a password" minlength="6" required
    style="padding-right:50px;">
  <button type="button" onclick="togglePassword('password', this)"
    style="position:absolute; right:4px; top:8px; width:44px; padding:8px; margin:0; background:#eee; color:#147d4b;">
    👁️
  </button>
</div>

      <button type="submit">Create Account</button>
  </form>

<hr>

<h3>Already have an account? Log In</h3>

<form id="loginForm">
  <input id="loginEmail" type="email"
    placeholder="Your Gmail address" required>

 
<div style="position:relative;">
  <input id="loginPassword" type="password"
    placeholder="Your password" required
    style="padding-right:50px;">
  <button type="button" onclick="togglePassword('loginPassword', this)"
    style="position:absolute; right:4px; top:8px; width:44px; padding:8px; margin:0; background:#eee; color:#147d4b;">
    👁️
  </button>
</div>

  <button type="submit">Log In</button>
</form>

<p id="loginMessage" role="status"></p>
<p id="message" role="status"></p>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import {
     getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
sendEmailVerification,
signOut
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

   const firebaseConfig = {
  apiKey: "AIzaSyB3B5vPcdEeMyGR66HykE6T2yKmXKEAe6g",
  authDomain: "hysacam-kumba-tracker.firebaseapp.com",
  projectId: "hysacam-kumba-tracker",
  appId: "1:1000510691567:web:4ea94b7cc3dcc0fa92631a"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");
      
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.textContent = "Creating your account...";

  try {
    const credential = await createUserWithEmailAndPassword(
      auth,
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    );

    await sendEmailVerification(credential.user);
    await signOut(auth);

    message.textContent =
      "Account created! Check your Gmail and tap the verification link, then log in.";
    form.reset();
  } catch (error) {
    message.textContent = error.message;
  }
});

const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  loginMessage.textContent = "Signing in...";

  try {
    const credential = await signInWithEmailAndPassword(
      auth,
      document.getElementById("loginEmail").value.trim(),
      document.getElementById("loginPassword").value
    );

    if (!credential.user.emailVerified) {
      await sendEmailVerification(credential.user);
      await signOut(auth);
      loginMessage.textContent =
        "Check your Gmail and tap the verification link before logging in.";
      return;
    }

    window.location.href = "index.html";
  } catch (error) {
    loginMessage.textContent = error.message;
  }
});
window.togglePassword = function (id, button) {
  const input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    button.textContent = "🙈";
  } else {
    input.type = "password";
    button.textContent = "👁️";
  }
};
  </script>
</body>
</html>
