<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#087747"><title>Connecting Google | HYSACAM Kumba Tracker</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-body"><main class="auth-reference-page"><section class="auth-reference-card oauth-callback-card">
<a class="auth-reference-logo" href="index.html"><span class="hysacam-mark" aria-hidden="true">♻</span></a>
<h1>Finishing sign in</h1><p id="oauth-status" class="auth-subtitle">Securely connecting your Google account</p><div class="auth-loading-mark" aria-hidden="true"></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script>
<script>
(async()=>{
 const params=new URLSearchParams(location.search);
 const hashParams=new URLSearchParams(location.hash.replace(/^#/,''));
 const oauthError=params.get('error')||hashParams.get('error');
 const oauthDescription=params.get('error_description')||hashParams.get('error_description')||'';
 const isCancellation=oauthError==='access_denied'||/cancel|denied|dismiss/i.test(oauthDescription);
 const goToLogin=(message)=>{
  if(message) sessionStorage.setItem('hysacam_auth_flash',message);
  location.replace('/signin.html');
 };
 // Google cancellation is a normal user action, not a failed session to display.
 if(isCancellation){goToLogin();return;}
 try{
  const {data,error}=await window.supabaseClient.auth.getSession();
  if(error||!data.session){
   const isCancelled=oauthError==='access_denied'||/cancel|denied|dismiss/i.test(oauthDescription);
   goToLogin(isCancelled?'':'Google sign-in could not be completed. Please try again.');
   return;
  }
  const intent=sessionStorage.getItem('hysacam_google_intent')||'resident';
  const endpoint=intent==='admin'?'/api/admin/oauth-start':'/api/auth/oauth-session';
  const response=await fetch(endpoint,{method:'POST',credentials:'include',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:data.session.access_token,refresh_token:data.session.refresh_token})});
  const result=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(result.message||'Google sign-in could not be completed. Please try again.');
  // The application HttpOnly session is now established. Clear only the temporary
  // Supabase browser session; do not clear the HYSACAM server session cookie.
  await window.supabaseClient.auth.signOut();
  if(intent==='admin'){
   sessionStorage.setItem('hysacam_admin_google_email',result.email||'');
   location.replace('/admin.html?google_admin=1');
  }else{
   const next=sessionStorage.getItem('hysacam_google_next')||'';
   sessionStorage.removeItem('hysacam_google_intent');
   sessionStorage.removeItem('hysacam_google_next');
   location.replace(next==='report'?'/index.html#report':'/index.html');
  }
 }catch(error){
  // Never leave the user stranded on the callback/loading page.
  goToLogin(error?.message||'Google sign-in could not be completed. Please try again.');
 }
})();
</script></body></html>
